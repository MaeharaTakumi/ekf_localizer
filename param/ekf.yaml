# EKF のパラメータ。説明は README.md の「パラメータ」を参照
/**:
    ros__parameters:
      use_odom: true
      # TF map → base・ekf_pose・ekf_odom を、最新の状態を現在時刻まで予測して出す周期 [Hz]。NDT の初期値と MATLAB は
      # この TF を点群の stamp で引く（補間）。オドメトリと同じ 50 Hz（点群は stamp から約 15 ms で届くので、待っても 5 ms ほど）
      predict_rate: 50.0
      # TF を周期の刻みの stamp で送るとき、今より後の刻みの数と、今以前の刻みを送り直す数（0 なら今の時刻の 1 個だけ。README）
      tf_future_steps: 0
      tf_past_steps: 0
      history_length: 1.0
      max_predict_dt: 0.2

      ndt_pose_topic: "ndt_pose"
      odom_topic: "odom"
      initialpose_topic: "initialpose"

      map_frame_id: "map"
      base_frame_id: "base_link"
      lidar_frame_id: "velodyne"

      # Q・P_init の並びは状態と同じ [x, y, z, roll, pitch, yaw, v_xy, v_z, omega_roll, omega_pitch, omega_yaw]。
      # v_z・omega_roll・omega_pitch の Q と P_init を 0 にすると、その 3 つは 0 のまま（z・roll・pitch は Q のノイズだけで動かない）
      # Q・P_init・R_ndt の既定は実機 blue の値（2026-11-09、ユーザー指示）
      Q:      [5.0e-2, 5.0e-2, 5.0e-3, 5.0e-2, 5.0e-2, 5.0e-2, 0.05, 0.0, 0.1, 0.1, 10.0]
      P_init: [2.0e-1, 2.0e-1, 2.0e-1, 0.01, 0.01, 0.01, 0.01, 0.0, 0.01, 0.01, 0.01]
      R_ndt:  [0.000208, 0.000155, 9.61e-05, 5.89e-05, 6.32e-05, 1.23e-05] # [x, y, z, roll, pitch, yaw]（LiDAR）
      # オドメトリの観測ノイズ（分散）。全環境で同じ値（2026-11-09 に当時の odom_covariance（今の odom_relay）から移した。実機 blue の値）
      #   R_v     = R_odom[0] + odom_noise_alpha[0]·v² + odom_noise_alpha[1]·ω² + (accel_noise_tau[0]·dv/dt)²
      #   R_omega = R_odom[1] + odom_noise_alpha[2]·v² + odom_noise_alpha[3]·ω² + (accel_noise_tau[1]·dω/dt)²
      R_odom: [6.08e-3, 9.92e-4]                # 速さ・加速度によらない分 [v, omega]
      odom_noise_alpha: [0.0, 0.0, 0.0, 0.0]    # 速さに応じた分 [v²→R_v, ω²→R_v, v²→R_omega, ω²→R_omega]
      accel_noise_tau: [0.0, 0.0]               # 加速度に応じた分 [τ_v, τ_omega] [s]

      gate_ndt: 1.0e5
      ndt_delay: 0.0

      gate_odom: 1.0e5
      odom_timeout_init: 0.2
      odom_delay: 0.00
