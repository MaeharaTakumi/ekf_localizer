# EKF のパラメータ。説明は README.md の「パラメータ」を参照
/**:
    ros__parameters:
      use_odom: true
      # 観測の時刻："stamp"（メッセージの stamp。遅れて届いた NDT は巻き戻して入れ直す）、
      #   "receipt"（受信した時刻。オドメトリはこのノードが受信した時刻、NDT はその点群を受信した時刻。
      #    NDT のノードに入っていたころの time_source: wall と同じ。NDT は計算の分遅れて届くので巻き戻して入れる）
      time_source: "stamp"
      points_topic: "velodyne_points"   # time_source: receipt のときだけ購読する
      # TF map → base・ekf_pose・ekf_odom を、最新の状態を現在時刻まで予測して出す周期 [Hz]。NDT の初期値と MATLAB は
      # この TF を点群の stamp で引く（補間）。オドメトリと同じ 50 Hz（点群は stamp から約 15 ms で届くので、待っても 5 ms ほど）
      predict_rate: 50.0
      history_length: 1.0
      max_predict_dt: 0.2

      ndt_pose_topic: "ndt_pose"
      odom_topic: "odom"
      initialpose_topic: "initialpose"

      map_frame_id: "map"
      base_frame_id: "base_link"
      lidar_frame_id: "velodyne"

      Q:      [5.0e-2, 5.0e-2, 5.0e-3, 5.0e-2, 5.0e-2, 5.0e-2, 0.05, 1.0e-2] # [x, y, z, roll, pitch, yaw, v, omega]
      P_init: [2.0e-1, 2.0e-1, 2.0e-1, 0.01, 0.01, 0.01, 0.01, 0.01]
      R_ndt:  [1.0e-2, 1.0e-2, 1.0e-2, 0.03, 0.03, 1.0e-3] # [x, y, z, roll, pitch, yaw]（LiDAR）
      R_odom: [2.5e-3, 5.0e-3]  # [v, omega]

      gate_ndt: 1.0e5
      ndt_delay: 0.0

      odom_covariance_source: "param"
      gate_odom: 1.0e5
      odom_timeout_init: 0.2
      odom_delay: 0.00
